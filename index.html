<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      if (localStorage.getItem("login") !== "true") {
        location.href = "login.html";
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="text-end mb-2">
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>

      <div class="card shadow mx-auto" style="max-width: 500px">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="LOGO_PLN-UL.jpeg" width="180" />
          </div>

          <h4 class="text-center mb-4">Surat Masuk</h4>

          <input type="date" id="tanggal" class="form-control mb-2" required />
          <input
            id="nomorSurat"
            class="form-control mb-2"
            placeholder="Nomor Surat"
            required
          />
          <input
            id="tujuan"
            class="form-control mb-2"
            placeholder="Tujuan"
            required
          />
          <textarea
            id="keterangan"
            class="form-control mb-2"
            placeholder="Keterangan"
            required
          ></textarea>

          <!-- LINK DRIVE -->
          <input
            type="url"
            id="evidence"
            class="form-control mb-3"
            placeholder="Tempel link Google Drive"
            required
          />

          <button
            class="btn btn-primary w-100"
            id="btnSimpan"
            onclick="simpan()"
          >
            Simpan
          </button>
          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("login");
        location.href = "login.html";
      }

      function simpan() {
        const btn = document.getElementById("btnSimpan");
        const alertBox = document.getElementById("alertBox");

        btn.disabled = true;
        btn.innerText = "Menyimpan...";

        fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify({
            tanggal: document.getElementById("tanggal").value,
            nomorSurat: document.getElementById("nomorSurat").value,
            tujuan: document.getElementById("tujuan").value,
            keterangan: document.getElementById("keterangan").value,
            evidence: document.getElementById("evidence").value,
          }),
        })
          .then(() => {
            alertBox.innerHTML =
              '<div class="alert alert-success">✅ Data berhasil disimpan</div>';

            document.querySelector("form")?.reset();
          })
          .catch(() => {
            alertBox.innerHTML =
              '<div class="alert alert-danger">❌ Gagal menyimpan</div>';
          })
          .finally(() => {
            btn.disabled = false;
            btn.innerText = "Simpan";
          });
      }
    </script>
  </body>
</html>
