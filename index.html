<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk PLN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <script>
      if (!localStorage.getItem("login")) {
        location.href = "login.html";
      }
    </script>

    <nav class="navbar navbar-dark bg-primary px-3">
      <div class="d-flex align-items-center">
        <img src="logo-pln.png" height="40" class="me-2" />
        <span class="navbar-brand">Surat Masuk PLN</span>
      </div>
      <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </nav>

    <div class="container mt-5">
      <div class="card p-4 shadow mx-auto" style="max-width: 500px">
        <h5 class="text-center mb-4">Input Surat Masuk</h5>

        <input type="date" id="tanggal" class="form-control mb-3" />
        <input
          id="nomorSurat"
          class="form-control mb-3"
          placeholder="Nomor Surat"
        />
        <input id="tujuan" class="form-control mb-3" placeholder="Tujuan" />
        <textarea
          id="keterangan"
          class="form-control mb-3"
          placeholder="Keterangan"
        ></textarea>

        <input
          type="file"
          id="evidence"
          class="form-control mb-4"
          accept="image/*"
        />

        <button class="btn btn-primary w-100" onclick="simpan()">Simpan</button>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      function simpan() {
        const file = document.getElementById("evidence").files[0];
        if (!file) return alert("Pilih foto evidence dulu");

        const reader = new FileReader();
        reader.onload = () => {
          fetch(API_URL, {
            method: "POST",
            body: new URLSearchParams({
              action: "insert",
              tanggal: tanggal.value,
              nomorSurat: nomorSurat.value,
              tujuan: tujuan.value,
              keterangan: keterangan.value,
              file: reader.result.split(",")[1],
              filename: file.name,
              mimeType: file.type,
            }),
          })
            .then((r) => r.json())
            .then(() => {
              alert("Data berhasil disimpan");
              location.reload();
            });
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
