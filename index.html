<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-body">
              <h4 class="text-center mb-4">Surat Masuk</h4>

              <form id="formSurat">
                <input
                  type="date"
                  class="form-control mb-2"
                  id="tanggal"
                  required
                />
                <input
                  type="text"
                  class="form-control mb-2"
                  id="nomorSurat"
                  placeholder="Nomor Surat"
                  required
                />
                <input
                  type="text"
                  class="form-control mb-2"
                  id="tujuan"
                  placeholder="Tujuan"
                  required
                />
                <textarea
                  class="form-control mb-2"
                  id="keterangan"
                  placeholder="Keterangan"
                  required
                ></textarea>

                <input
                  type="file"
                  class="form-control mb-3"
                  id="foto"
                  accept="image/*"
                  required
                />

                <button class="btn btn-primary w-100">Simpan</button>
              </form>

              <div id="alertBox" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      const form = document.getElementById("formSurat");
      const alertBox = document.getElementById("alertBox");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const file = document.getElementById("foto").files[0];
        const reader = new FileReader();

        reader.onload = async function () {
          const base64 = reader.result.split(",")[1];

          const data = new URLSearchParams({
            action: "insert",
            tanggal: document.getElementById("tanggal").value,
            nomorSurat: document.getElementById("nomorSurat").value,
            tujuan: document.getElementById("tujuan").value,
            keterangan: document.getElementById("keterangan").value,
            fileBase64: base64,
            fileType: file.type,
          });

          const res = await fetch(API_URL, {
            method: "POST",
            body: data,
          });

          const json = await res.json();

          alertBox.innerHTML =
            json.status === "success"
              ? `<div class="alert alert-success">✅ Data & foto tersimpan</div>`
              : `<div class="alert alert-danger">❌ Gagal</div>`;

          form.reset();
        };

        reader.readAsDataURL(file);
      });
    </script>
  </body>
</html>
