<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      if (localStorage.getItem("login") !== "true") {
        location.href = "login.html";
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="text-end mb-2">
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>

      <div class="card shadow mx-auto" style="max-width: 500px">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="LOGO_PLN-UL.jpeg" width="180" />
          </div>

          <h4 class="text-center mb-4">Surat Masuk</h4>

          <!-- FORM -->
          <input type="date" id="tanggal" class="form-control mb-2" required />

          <input
            id="nomorSurat"
            class="form-control mb-2"
            placeholder="Nomor Surat"
            required
          />

          <input
            id="tujuan"
            class="form-control mb-2"
            placeholder="Tujuan"
            required
          />

          <textarea
            id="keterangan"
            class="form-control mb-2"
            placeholder="Keterangan"
            required
          ></textarea>

          <!-- LINK DRIVE -->
          <input
            id="evidence"
            class="form-control mb-3"
            placeholder="Link Google Drive Evidence"
            value="https://drive.google.com/file/d/1PpHXI1YMMCs5WYXQITY1WeqtfnxC9AYr/view"
            required
          />

          <button
            class="btn btn-primary w-100"
            id="btnSimpan"
            onclick="simpan()"
          >
            Simpan
          </button>

          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("login");
        location.href = "login.html";
      }

      function simpan() {
        const btn = document.getElementById("btnSimpan");
        const alertBox = document.getElementById("alertBox");

        btn.disabled = true;
        btn.innerText = "Menyimpan...";

        fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            tanggal: tanggal.value,
            nomorSurat: nomorSurat.value,
            tujuan: tujuan.value,
            keterangan: keterangan.value,
            evidence: evidence.value,
          }),
        })
          .then((r) => r.json())
          .then((res) => {
            if (res.status === "success") {
              alertBox.innerHTML =
                '<div class="alert alert-success">✅ Data berhasil disimpan</div>';
            } else {
              alertBox.innerHTML =
                '<div class="alert alert-danger">❌ ' + res.message + "</div>";
            }
          })
          .catch(() => {
            alertBox.innerHTML =
              '<div class="alert alert-danger">❌ Koneksi error</div>';
          })
          .finally(() => {
            btn.disabled = false;
            btn.innerText = "Simpan";
          });
      }
    </script>
  </body>
</html>
