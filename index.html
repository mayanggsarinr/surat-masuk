<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      if (localStorage.getItem("login") !== "true") {
        location.href = "login.html";
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="text-end mb-2">
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>

      <div class="card shadow mx-auto" style="max-width: 500px">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="LOGO_PLN-UL.jpeg" width="180" />
          </div>

          <h4 class="text-center mb-4">Surat Masuk</h4>

          <!-- FORM -->
          <input type="date" id="tanggal" class="form-control mb-2" required />
          <input
            id="nomorSurat"
            class="form-control mb-2"
            placeholder="Nomor Surat"
            required
          />
          <input
            id="tujuan"
            class="form-control mb-2"
            placeholder="Tujuan"
            required
          />
          <textarea
            id="keterangan"
            class="form-control mb-2"
            placeholder="Keterangan"
            required
          ></textarea>

          <input
            type="file"
            id="evidence"
            class="form-control mb-2"
            accept="image/*"
            onchange="previewImage()"
            required
          />

          <!-- PREVIEW -->
          <div class="text-center mb-3">
            <img
              id="preview"
              style="max-width: 100%; display: none"
              class="rounded border"
            />
          </div>

          <button
            class="btn btn-primary w-100"
            id="btnSimpan"
            onclick="simpan()"
          >
            Simpan
          </button>

          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("login");
        location.href = "login.html";
      }

      function simpan() {
        const btn = document.getElementById("btnSimpan");
        const alertBox = document.getElementById("alertBox");
        const file = document.getElementById("evidence").files[0];

        if (!file) {
          alertBox.innerHTML =
            '<div class="alert alert-warning">Upload bukti dulu</div>';
          return;
        }

        btn.disabled = true;
        btn.innerText = "Menyimpan...";

        const reader = new FileReader();

        reader.onload = function () {
          const payload = {
            tanggal: tanggal.value,
            nomorSurat: nomorSurat.value,
            tujuan: tujuan.value,
            keterangan: keterangan.value,
            file: reader.result.split(",")[1],
            filename: file.name,
            mimeType: file.type,
          };

          fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          })
            .then((r) => r.json())
            .then((res) => {
              if (res.status === "success") {
                alertBox.innerHTML =
                  '<div class="alert alert-success">✅ Data berhasil disimpan</div>';
                document.getElementById("tanggal").value = "";
                document.getElementById("nomorSurat").value = "";
                document.getElementById("tujuan").value = "";
                document.getElementById("keterangan").value = "";
                document.getElementById("evidence").value = "";
              } else {
                alertBox.innerHTML = `<div class="alert alert-danger">❌ ${res.message}</div>`;
              }
            })
            .catch((err) => {
              alertBox.innerHTML =
                '<div class="alert alert-danger">❌ Koneksi error</div>';
              console.error(err);
            })
            .finally(() => {
              btn.disabled = false;
              btn.innerText = "Simpan";
            });
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
