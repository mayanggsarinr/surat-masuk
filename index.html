<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      if (localStorage.getItem("login") !== "true") {
        location.href = "login.html";
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="text-end mb-2">
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
      </div>

      <div class="card shadow mx-auto" style="max-width: 500px">
        <div class="card-body">
          <div class="text-center mb-3">
            <img src="LOGO_PLN-UL.jpeg" width="200" />
          </div>

          <h4 class="text-center mb-4">Surat Masuk</h4>

          <input type="date" id="tanggal" class="form-control mb-2" />
          <input
            id="nomorSurat"
            class="form-control mb-2"
            placeholder="Nomor Surat"
          />
          <input id="tujuan" class="form-control mb-2" placeholder="Tujuan" />
          <textarea
            id="keterangan"
            class="form-control mb-2"
            placeholder="Keterangan"
          ></textarea>
          <input
            type="file"
            id="evidence"
            class="form-control mb-3"
            accept="image/*"
          />

          <button class="btn btn-primary w-100" onclick="simpan()">
            Simpan
          </button>
          <div id="alertBox" class="mt-3"></div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>
    <script>
      function logout() {
        localStorage.removeItem("login");
        location.href = "login.html";
      }

      function simpan() {
        const file = evidence.files[0];
        const reader = new FileReader();

        reader.onload = () => {
          fetch(API_URL, {
            method: "POST",
            body: new URLSearchParams({
              action: "insert",
              tanggal: tanggal.value,
              nomorSurat: nomorSurat.value,
              tujuan: tujuan.value,
              keterangan: keterangan.value,
              file: reader.result.split(",")[1],
              filename: file.name,
              mimeType: file.type,
            }),
          })
            .then((r) => r.json())
            .then(() => {
              alertBox.innerHTML = `<div class="alert alert-success">Data berhasil disimpan</div>`;
            });
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
