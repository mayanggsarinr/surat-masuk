<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk PLN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f6fa;
      }
      .card {
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-primary px-3">
      <div class="d-flex align-items-center">
        <img src="logo-pln.png" height="40" class="me-2" />
        <span class="navbar-brand mb-0 h5">Surat Masuk PLN</span>
      </div>
      <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </nav>

    <!-- FORM -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow p-4">
            <h5 class="text-center mb-4">Input Surat Masuk</h5>

            <input type="date" id="tanggal" class="form-control mb-3" />
            <input
              type="text"
              id="nomorSurat"
              class="form-control mb-3"
              placeholder="Nomor Surat"
            />
            <input
              type="text"
              id="tujuan"
              class="form-control mb-3"
              placeholder="Tujuan"
            />
            <textarea
              id="keterangan"
              class="form-control mb-3"
              placeholder="Keterangan"
            ></textarea>

            <input
              type="file"
              id="evidence"
              class="form-control mb-4"
              accept="image/*"
            />

            <button class="btn btn-primary w-100" onclick="simpan()">
              Simpan
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPT -->
    <script>
      /* 🔐 CEK LOGIN */
      if (!localStorage.getItem("login")) {
        window.location.href = "login.html";
      }

      /*LOGOUT */
      function logout() {
        localStorage.removeItem("login");
        window.location.href = "login.html";
      }

      /*SIMPAN DATA */
      function simpan() {
        const fileInput = document.getElementById("evidence");
        const file = fileInput.files[0];

        if (!file) {
          alert("Pilih foto evidence dulu");
          return;
        }

        const reader = new FileReader();
        reader.onload = function () {
          const base64 = reader.result.split(",")[1];

          fetch(
            "https://script.google.com/macros/s/PASTE_URL_WEBAPP_KAMU/exec?action=insert",
            {
              method: "POST",
              body: new URLSearchParams({
                tanggal: document.getElementById("tanggal").value,
                nomorSurat: document.getElementById("nomorSurat").value,
                tujuan: document.getElementById("tujuan").value,
                keterangan: document.getElementById("keterangan").value,
                file: base64,
                filename: file.name,
                mimeType: file.type,
              }),
            },
          )
            .then((res) => res.json())
            .then((res) => {
              if (res.status === "success") {
                alert("Data berhasil disimpan");
                location.reload();
              } else {
                alert(res.message);
              }
            });
        };
        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
