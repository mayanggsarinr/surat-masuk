<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      if (localStorage.getItem("login") !== "true") {
        window.location.href = "login.html";
      }
    </script>
  </head>

  <body class="bg-light">
    <div class="container mt-4">
      <div class="text-end mb-2">
        <button class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
      </div>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-body">
              <div class="text-center mb-3">
                <img src="LOGO_PLN-UL.jpeg" width="200" />
              </div>

              <h4 class="text-center mb-4">Surat Masuk</h4>

              <form id="formSurat">
                <div class="mb-3">
                  <label class="form-label">Tanggal Surat</label>
                  <input type="date" class="form-control" id="tanggal" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Nomor Surat</label>
                  <input type="text" class="form-control" id="nomorSurat" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Tujuan</label>
                  <input type="text" class="form-control" id="tujuan" />
                </div>

                <div class="mb-3">
                  <label class="form-label">Keterangan</label>
                  <textarea class="form-control" id="keterangan"></textarea>
                </div>

                <button class="btn btn-primary w-100" id="btnSubmit">
                  Simpan
                </button>
              </form>

              <div id="alertBox" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="config.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("login");
        window.location.href = "login.html";
      }

      const form = document.getElementById("formSurat");
      const alertBox = document.getElementById("alertBox");
      const btn = document.getElementById("btnSubmit");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const tanggal = document.getElementById("tanggal").value;
        const nomorSurat = document.getElementById("nomorSurat").value;
        const tujuan = document.getElementById("tujuan").value;
        const keterangan = document.getElementById("keterangan").value;

        if (!tanggal || !nomorSurat || !tujuan || !keterangan) {
          alertBox.innerHTML = `<div class="alert alert-warning">⚠️ Semua input wajib diisi</div>`;
          return;
        }

        btn.disabled = true;
        btn.innerText = "Menyimpan...";

        fetch(URL_API, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            action: "insert",
            tanggal,
            nomorSurat,
            tujuan,
            keterangan,
          }),
        })
          .then((res) => res.json())
          .then((res) => {
            if (res.status === "success") {
              alertBox.innerHTML = `<div class="alert alert-success">✅ Data berhasil disimpan</div>`;
              form.reset();
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">❌ Data gagal disimpan</div>`;
            }
          })
          .catch(() => {
            alertBox.innerHTML = `<div class="alert alert-danger">❌ Error koneksi</div>`;
          })
          .finally(() => {
            btn.disabled = false;
            btn.innerText = "Simpan";
            setTimeout(() => (alertBox.innerHTML = ""), 2000);
          });
      });
    </script>
  </body>
</html>
