<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light d-flex justify-content-center align-items-center vh-100"
  >
    <div class="card shadow" style="width: 350px">
      <div class="card-body">
        <div class="text-center mb-3">
          <img src="LOGO_PLN-UL.jpeg" width="150" />
        </div>

        <h5 class="text-center mb-4">Login</h5>

        <input id="username" class="form-control mb-2" placeholder="Username" />
        <input
          id="password"
          type="password"
          class="form-control mb-3"
          placeholder="Password"
        />

        <button class="btn btn-primary w-100" onclick="login()">Login</button>
        <div id="alertBox" class="mt-3"></div>
      </div>
    </div>

    <script>
      function login() {
        const u = username.value;
        const p = password.value;

        if (u === "admin1" && p === "pln123") {
          localStorage.setItem("login", "admin1");
          location.href = "index.html";
        } else if (u === "admin2" && p === "pln123") {
          localStorage.setItem("login", "admin2");
          location.href = "sanksi.html";
        } else {
          alertBox.innerHTML =
            '<div class="alert alert-danger">Login salah</div>';
        }
      }
    </script>
  </body>
</html>
