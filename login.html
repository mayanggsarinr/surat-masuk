<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card shadow p-4" style="width: 360px">
      <div class="text-center mb-3">
        <img src="LOGO_PLN-UL.jpeg" width="180" />
      </div>

      <h5 class="text-center mb-3">Login Surat Masuk</h5>

      <input id="username" class="form-control mb-2" placeholder="Username" />
      <input
        id="password"
        type="password"
        class="form-control mb-3"
        placeholder="Password"
      />

      <button class="btn btn-primary w-100" onclick="login()">Login</button>
      <div id="alertBox" class="mt-3"></div>
    </div>

    <script src="config.js"></script>
    <script>
      function login() {
        const u = username.value.trim();
        const p = password.value.trim();

        fetch(`${API_URL}?action=login&username=${u}&password=${p}`)
          .then((r) => r.json())
          .then((r) => {
            if (r.status === "success") {
              localStorage.setItem("login", "true");
              location.href = "index.html";
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">${r.message}</div>`;
            }
          });
      }
    </script>
  </body>
</html>
