<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow">
            <div class="card-body">
              <div class="text-center mb-3">
                <img src="LOGO_PLN-UL.jpeg" width="180" />
              </div>

              <h5 class="text-center mb-4">Login Surat Masuk</h5>

              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" />
              </div>

              <button class="btn btn-primary w-100" onclick="login()">
                Login
              </button>

              <div id="alertBox" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- WAJIB: config.js berisi const API_URL -->
    <script src="config.js"></script>

    <script>
      function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const alertBox = document.getElementById("alertBox");

        alertBox.innerHTML = "";

        // 🔥 INI KUNCI UTAMA (FormData, BUKAN JSON)
        const formData = new FormData();
        formData.append("action", "login");
        formData.append("username", username);
        formData.append("password", password);

        fetch(API_URL, {
          method: "POST",
          body: formData,
        })
          .then((res) => res.json())
          .then((res) => {
            console.log(res); // DEBUG

            if (res.status === "success") {
              window.location.href = "index.html";
            } else {
              alertBox.innerHTML = `<div class="alert alert-danger">❌ Username atau password salah</div>`;
            }
          })
          .catch((err) => {
            console.error(err);
            alertBox.innerHTML = `<div class="alert alert-danger">❌ Gagal koneksi ke server</div>`;
          });
      }
    </script>
  </body>
</html>
