<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login Surat Masuk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light d-flex justify-content-center align-items-center vh-100"
  >
    <div class="card shadow" style="width: 350px">
      <div class="card-body">
        <div class="text-center mb-3">
          <img src="LOGO_PLN-UL.jpeg" width="150" />
        </div>

        <h5 class="text-center mb-4">Login Surat Masuk</h5>

        <input
          type="text"
          id="username"
          class="form-control mb-2"
          placeholder="Username"
        />

        <input
          type="password"
          id="password"
          class="form-control mb-3"
          placeholder="Password"
        />

        <button class="btn btn-primary w-100" onclick="login()">Login</button>

        <div id="alertBox" class="mt-3"></div>
      </div>
    </div>

    <script>
      function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (u === "admin" && p === "pln123") {
          localStorage.setItem("login", "true");
          location.href = "index.html";
        } else {
          document.getElementById("alertBox").innerHTML =
            `<div class="alert alert-danger">Username / password salah</div>`;
        }
      }
    </script>
  </body>
</html>
